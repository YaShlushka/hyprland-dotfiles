source = ~/.config/hypr/scripts/touchpad.conf

monitor=eDP-1,1920x1080@144,0x0,1.251

$terminal = kitty
$fileManager = thunar
$menu = ~/.config/rofi/launchers/type-6/launcher.sh
$browser = firefox

exec-once = hyprlock
exec-once = waybar
exec-once = swaync
exec-once = awww-daemon
exec-once = eww daemon
exec-once = rm -f ~/.cache/cliphist/db
exec-once = ~/.config/eww/volume-indicator/scripts/volume.sh &
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = syncthing --no-browser &
exec-once = ~/.config/hypr/scripts/delete_steam_shaders_cache.sh

env = XCURSOR_THEME,Layan-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Layan-cursors
env = HYPRCURSOR_SIZE,24

# nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GL_VRR_ALLOWED,1
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_EGL_NO_MODIFIERS,1
env = WLR_DRM_NO_ATOMIC,1

# wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# env = QT_IM_MODULE,fcitx
# env = XMODIFIERS,@im=fcitx
# env = SDL_IM_MODULE,fcitx

cursor {
  no_hardware_cursors = true
}

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 20
    rounding_power = 2

    active_opacity = 0.9
    inactive_opacity = 0.8

    shadow {
        enabled = false
        range = 5
        render_power = 4
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4 # default = 3 my = 4
        passes = 3 # default = 1 my = 3
		  new_optimizations = true
		  ignore_opacity = true
		  noise = 0
		  brightness = 0.9

        vibrancy = 0.1696 # default = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

	 bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

	 bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
	 animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
	 animation = windowsMove, 1, 5, wind, slide

    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
	 animation = workspaces, 1, 5, wind, slide
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:win_space_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
		
	 # disable acceleration
	 accel_profile = 0
	 force_no_accel = true

    touchpad {
	     natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, telegram
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, W, exec, ~/.config/hypr/scripts/swww_change.sh
bind = $mainMod, N, exec, swaync-client -t

# Rofi menus
bind = $mainMod, R, exec, $menu
bind = ALT, F4, exec, ~/.config/rofi/applets/bin/powermenu.sh
bind = $mainMod, D, exec, ~/.config/rofi/applets/bin/quicklinks.sh

# Screenshot
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/screenshots

#touchpad bind
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/touchpad.sh

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# move window with mainMod + shift + arrow keys
bind = SUPER_SHIFT, left, movewindow, l
bind = SUPER_SHIFT, right, movewindow, r
bind = SUPER_SHIFT, up, movewindow, u
bind = SUPER_SHIFT, down, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, M, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl --player=spotify,%any next
bindl = , XF86AudioPause, exec, playerctl --player=spotify,%any play-pause
bindl = , XF86AudioPlay, exec, playerctl --player=spotify,%any play-pause
bindl = , XF86AudioPrev, exec, playerctl --player=spotify,%any previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppress_event fullscreen maximize, match:class .*
#
# # Fix some dragging issues with XWayland
# windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, float 1, fullscreen 0, pin 0
#
# Opacity rules
windowrule = opacity 1 override 0.9 override, match:class code
windowrule = opacity 1 override 0.9 override, match:class Chromium
windowrule = opacity 0.8 override 0.7 override, match:class thunar
windowrule = opacity 1 override 1 override, match:class osu!

# Float or not
windowrule = fullscreen 1, match:class osu!
windowrule = fullscreen 1, match:class org.telegram.desktop._3fe043eafef11bcb20f67ece47d3408e, match:title Просмотр медиа
windowrule = float 1, center 1, match:class org.gnome.Calculator
windowrule = float 1, center 1, match:class Windscribe
windowrule = float 1, center 1, match:class thunar, match:title Rename ".*"
windowrule = float 1, center 1, match:class thunar, match:title File Operation Progress
windowrule = float 1, center 1, match:class firefox, match:title Library
windowrule = float 1, center 1, match:class firefox, match:title Библиотека
windowrule = float 1, center 1, match:class PenTablet
windowrule = float 1, center 1, match:class xdg-desktop-portal-gtk
windowrule = float 1, center 1, match:class com.network.manager
windowrule = float 1, center 1, match:class blueman-manager

# Size rules
windowrule = size 359 500, match:class org.gnome.Calculator
windowrule = size 332 701, match:class Windscribe
windowrule = size 768 600, match:class firefox, match:title Library
windowrule = size 768 600, match:class firefox, match:title Библиотека
windowrule = size 750 700, match:class xdg-desktop-portal-gtk, match:title Open Folder
windowrule = size 750 700, match:class xdg-desktop-portal-gtk, match:title Open File

# Focus settings
windowrule = no_focus 1, match:class swaync
windowrule = stay_focused 1, match:class thunar, match:title Rename ".*"

# Layer rules
layerrule = blur 1, ignore_alpha 0, animation slide right, match:namespace swaync-control-center
layerrule = blur 1, ignore_alpha 0, match:namespace notifications
layerrule = blur 1, ignore_alpha 0, match:namespace swaync-notification-window
layerrule = blur 1, ignore_alpha 0.5, animation fade, match:namespace rofi

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

xwayland {
  force_zero_scaling = true
}
